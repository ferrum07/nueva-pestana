<!DOCTYPE html>
<!-- saved from url=(0041)https://ferrum07.github.io/nueva-pestana/ -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva pestaña</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #e8e8e8;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
  }

  .clock {
    font-size: 72px;
    font-weight: 200;
    letter-spacing: -2px;
    color: #ffffff;
  }

  .date {
    font-size: 16px;
    color: #888;
    margin-top: 8px;
    letter-spacing: 0.04em;
    text-align: center;
  }

  .cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 160px;
    height: 160px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    text-decoration: none;
    color: #e8e8e8;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
  }

  .card:hover {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.18);
    transform: translateY(-3px);
  }

  .card:active {
    transform: translateY(0) scale(0.97);
  }

  .card-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.06);
  }

  .card-icon img {
    width: 30px;
    height: 30px;
  }

  .card-label {
    font-size: 14px;
    font-weight: 400;
    color: #aaa;
    letter-spacing: 0.02em;
  }

  .card-name {
    font-size: 15px;
    font-weight: 500;
    color: #e8e8e8;
    margin-top: -8px;
  }
</style>
</head>
<body>

<div style="display:flex; flex-direction:column; align-items:center;">
  <div class="clock" id="clock">20:28</div>
  <div class="date" id="date">jueves, 30 de julio de 2026</div>
</div>

<div class="cards">

  <a href="https://claude.ai/" class="card">
    <div class="card-icon">
      <img src="https://cdn.simpleicons.org/anthropic/CC785C" alt="Claude">
    </div>
    <div>
      <div class="card-name">Claude</div>
      <div class="card-label">claude.ai</div>
    </div>
  </a>

  <a href="https://google.com/" class="card">
    <div class="card-icon" style="background: #101010;">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Google_Favicon_2025.svg/960px-Google_Favicon_2025.svg.png" alt="Google" style="width: 30px; height: 30px; object-fit: contain;">
    </div>
    <div>
      <div class="card-name">Google</div>
      <div class="card-label">google.com</div>
    </div>
  </a>

  <a href="https://gemini.google.com/" class="card">
    <div class="card-icon">
      <img src="https://cdn.simpleicons.org/googlegemini/8E75F5" alt="Gemini">
    </div>
    <div>
      <div class="card-name">Gemini</div>
      <div class="card-label">gemini.google.com</div>
    </div>
  </a>

  <a href="https://chat.openai.com/" class="card">
    <div class="card-icon">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/46/ChatGPT_Search_logo_Black_Square_-_rounded_corners.svg" alt="ChatGPT" style="width: 40px; height: 40px; object-fit: contain; border-radius: 10px;">
    </div>
    <div>
      <div class="card-name">ChatGPT</div>
      <div class="card-label">chat.openai.com</div>
    </div>
  </a>

  <a href="https://jellyfin.cosaspoposas.com/web/#/home" class="card">
    <div class="card-icon">
      <img src="https://cdn.simpleicons.org/jellyfin/00A4DC" alt="Jellyfin">
    </div>
    <div>
      <div class="card-name">Jellyfin</div>
      <div class="card-label">jellyfin.cosaspoposas.com</div>
    </div>
  </a>

</div>

<script>
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = h + ':' + m;

  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('date').textContent = now.toLocaleDateString('es-ES', opts);
}
updateClock();
setInterval(updateClock, 10000);
</script>


</body></html>
